name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar PyInstaller
        run: pip install pyinstaller

      - name: Compilar .exe
        run: python build.py

      - name: Compilar instal·lador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer\ubidiscover.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar fitxers
        shell: pwsh
        run: |
          Copy-Item dist\UbiDiscover.exe "dist\UbiDiscover-$env:APP_VERSION-portable.exe"
          Get-FileHash dist\UbiDiscover-*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS.txt

      - name: Artefactes (execució manual)
        uses: actions/upload-artifact@v4
        with:
          name: UbiDiscover-${{ env.APP_VERSION }}
          path: |
            dist/UbiDiscover-*.exe
            dist/SHA256SUMS.txt

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: UbiDiscover ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/UbiDiscover-${{ env.APP_VERSION }}-setup.exe
            dist/UbiDiscover-${{ env.APP_VERSION }}-portable.exe
            dist/SHA256SUMS.txt
